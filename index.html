  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --text: #fafafa;
      --muted: #888;
      --hover: #22d3ee;
      --font: "Saira", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #000;
      pointer-events: none;
    }

    #particles-js canvas { display: block; width: 100%; height: 100%; }

    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--hover); outline-offset: 4px; }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 5;
      padding: 8px 10px;
      background: var(--text);
      color: var(--bg);
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .page {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100% - 64px));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0 auto;
      padding: 64px 0;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -.04em;
    }

    .role { margin: 5px 0 0; color: var(--muted); }

    .contacts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 22px;
      font-size: .875rem;
    }

    .contacts a,
    .platforms a {
      color: var(--muted);
      text-decoration: none;
    }

    .contacts a:hover,
    .platforms a:hover { color: var(--text); }

    .apps { margin-top: 68px; }

    h2 {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 400;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .app-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px 48px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .app { min-width: 0; }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 11px;
      object-fit: cover;
    }

    .app-title { flex: 1; }
    .app-arrow { color: #555; font-size: 1rem; font-weight: 400; }

    .app-name {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--text);
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -.03em;
      text-decoration: none;
    }

    .app-name:hover { color: var(--hover); }
    .app-name:hover .app-arrow { color: var(--hover); }

    .platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 6px 0 0 62px;
      color: #444;
      font-size: .75rem;
    }

    .platforms a { display: inline-flex; align-items: center; min-height: 44px; }
    .platforms img { display: block; width: auto; height: 32px; }

    footer {
      margin-top: 54px;
      color: #777;
      font-size: .6875rem;
      line-height: 1.6;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 32px, 420px);
        justify-content: flex-start;
        padding-top: 42px;
      }

      .apps { margin-top: 48px; }
      .app-list { grid-template-columns: minmax(0, 1fr); gap: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
